[package]
name = "rust-webgl"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2"
js-sys="0.3"

[lib]
crate-type = ["cdylib"]

[dependencies.web-sys]
version = "0.3"

features = [
  "Document",
  "Element",
  "NodeList",
  "HtmlElement",
  "HtmlCollection",
  "WheelEvent",
  "TouchEvent",
  "TouchList",
  "Touch",
  "CssStyleDeclaration",
  "HtmlCanvasElement",
  "HtmlButtonElement",
  "WebGlRenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "Window",
  "MouseEvent"
]